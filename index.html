<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новогодний календарь</title><style>
*{box-sizing:border-box}
:root{color-scheme:dark;--gold:#ffe391;--orange:#ffa364;--quiet:#a9b9cd;--plum:#a63d79}
html,body{margin:0;min-height:100%;background:#0c172a;color:var(--gold);font-family:"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#223c5a 0%,#111f36 53%,#0c172a 100%)}
h1,h2,p,figure{margin:0}
.stage{isolation:isolate;position:relative;overflow:hidden;align-self:center;width:100%;aspect-ratio:6/7;max-width:calc((100svh - 25px)*6/7);justify-self:center;mask-image:linear-gradient(90deg,transparent,#000 13%,#000 87%,transparent),linear-gradient(transparent,#000 2.7%,#000 97%,transparent);mask-composite:intersect}
.stage>svg,.stage>img{display:block;width:100%;height:100%;object-fit:contain}
.wall{padding:18px clamp(18px,4vw,115px);display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.18fr) minmax(220px,1fr);gap:clamp(5px,1.2vw,28px);align-items:center;min-height:100svh;max-width:2800px;margin:auto}
.panel{position:relative;max-width:430px;width:100%;justify-self:center;padding:24px clamp(11px,1.45vw,30px);border-top:1px solid #e6c47355;border-bottom:1px solid #e6c47340}
.panel:before{content:"";position:absolute;left:0;top:-2px;width:35px;height:3px;background:#f6ca70;box-shadow:0 0 15px #ed9d4c45}
.panel h2{font-size:clamp(19px,1.75vw,36px);font-weight:550;letter-spacing:-.025em;color:#fff0b6}
.month-top{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:17px}
.month-top h2{line-height:1.1}
.controls{display:flex;gap:4px}
.controls button{font:inherit;border:1px solid #d4b97756;background:#22324b;color:#ffe391;border-radius:5px;padding:3px 7px;cursor:pointer;min-width:25px}
.controls button:focus-visible,.reshuffle:focus-visible{outline:2px solid #ffe391}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.days span{min-height:1.83em;display:grid;place-items:center;font-size:clamp(13px,1.17vw,25px);line-height:1}
.days .weekday{color:#c5c8cd;font-size:clamp(10px,.84vw,18px);font-weight:600;margin-bottom:.3em}
.days .weekend{color:var(--orange)}
.days .today{border-radius:7px;background:var(--plum);color:#fff4fb;font-weight:700;box-shadow:0 0 12px #bb69a342}
.today-line{margin-top:15px;font-size:clamp(11px,.83vw,17px);color:var(--quiet);min-height:1.3em}
.today-line time{color:#f3bce4}
.wishes h2{margin-bottom:19px}
.wish-text{font-family:Georgia,serif;color:#ffefd8;font-size:clamp(18px,1.75vw,36px);line-height:1.43;min-height:4.3em;letter-spacing:-.02em}
.reshuffle{margin-top:18px;border:0;padding:0;background:none;color:#e8c584;font:inherit;font-size:clamp(11px,.86vw,18px);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
@media(max-width:775px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;padding:12px 16px 30px}.stage{order:-1;grid-column:1/-1;max-width:min(100%,480px)}.panel{align-self:start}.days span{font-size:13px}.controls button{padding:4px}.month-top{align-items:flex-start}.panel h2{font-size:17px}}
@media(max-width:390px){.wall{grid-template-columns:1fr}.panel{width:min(100%,340px)}.days span{font-size:15px}}
.comet-flight{animation:comet-fly 10s linear infinite}
@keyframes comet-fly{
  0%{opacity:0;transform:translate(-460px,-275px)}
  12%{opacity:1}
  47%{opacity:.95}
  65%,100%{opacity:0;transform:translate(1000px,595px)}
}
@media(prefers-reduced-motion:reduce){.comet-flight{animation:none}}

<section class="panel wishes"><h2>С Новым годом!</h2><p class="wish-text">Пусть в новом году будет больше поводов радоваться и больше времени на то, что любишь.</p><button type="button" class="reshuffle">Следующее пожелание</button></section>
</main><script>const scene = document.querySelector('.stage > svg');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
const pupils = [...scene.querySelectorAll('.pupil')].map(element => ({
  element,
  cx: Number(element.getAttribute('cx')),
  cy: Number(element.getAttribute('cy')),
  rx: Number(element.getAttribute('rx')),
  ry: Number(element.getAttribute('ry')),
  x: 0,
  y: 0
}));
let pointer = null;
let pending = 0;

function draw() {
  pending = 0;
  const targets = pupils.map(({ element, cx, cy, rx, ry }) => {
    if (!pointer) return [0, 0];
    const matrix = element.parentNode.getScreenCTM();
    if (!matrix) return [0, 0];
    const local = pointer.matrixTransform(matrix.inverse());
    const dx = local.x - cx, dy = local.y - cy;
    const strength = Math.min(1, Math.hypot(dx, dy) / (rx * 12));
    const direction = Math.atan2(dy, dx);
    return [.76 * rx * strength * Math.cos(direction), .76 * ry * strength * Math.sin(direction)];
  });
  let moving = false;
  pupils.forEach((pupil, i) => {
    const [targetX, targetY] = targets[i];
    const smoothness = reduced.matches ? 1 : .25;
    pupil.x += (targetX - pupil.x) * smoothness;
    pupil.y += (targetY - pupil.y) * smoothness;
    moving ||= Math.abs(targetX - pupil.x) + Math.abs(targetY - pupil.y) > .045;
    pupil.element.setAttribute('transform', `translate(${pupil.x.toFixed(3)} ${pupil.y.toFixed(3)})`);
  });
  if (moving) schedule();
}
function schedule() {
  if (!pending) pending = requestAnimationFrame(draw);
}
function reset() {
  pointer = null;
  schedule();
}
document.addEventListener('pointermove', event => {
  pointer = new DOMPoint(event.clientX, event.clientY);
  schedule();
});
document.addEventListener('pointerdown', event => {
  pointer = new DOMPoint(event.clientX, event.clientY);
  schedule();
});
document.documentElement.addEventListener('pointerleave', reset);
document.addEventListener('pointercancel', reset);
window.addEventListener('blur', reset);
window.addEventListener('resize', schedule);

const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const wishes = ["Пусть в новом году будет больше поводов радоваться и больше времени на то, что любишь.", "Пусть рядом будут люди, с которыми тепло даже в самый снежный день.", "Желаю смелости начать то, что давно хотелось, и времени порадоваться результату.", "Пусть в новом году хватит сил на большие планы и времени на маленькие радости.", "Пусть дома будет уютно, на работе интересно, а впереди ждут хорошие сюрпризы.", "Пусть всё важное получается, а на любимых людей всегда находится время."];
const grid = document.querySelector('.days');
const title = document.querySelector('.month-top h2');
const todayLabel = document.querySelector('#today-label');
const wish = document.querySelector('.wish-text');
const dateFormat = new Intl.DateTimeFormat('ru-RU', {day:'numeric', month:'long',year:'numeric'});
let selectedMonth = null;
let lastDate = '';
let wishIndex = 0;
function paintCalendar() {
  const now = new Date();
  const active = selectedMonth || new Date(now.getFullYear(), now.getMonth(), 1);
  const year = active.getFullYear();
  const month = active.getMonth();
  title.textContent = monthNames[month] + ' ' + year;
  grid.replaceChildren();
  const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
  const length = new Date(year, month + 1, 0).getDate();
  const sameMonth = year === now.getFullYear() && month === now.getMonth();
  weekdays.forEach((name,i) => addCell(name, i > 4, 'weekday'));
  for (let cell = 0; cell < 42; cell++) {
    const day = cell - firstDay + 1;
    if (day < 1 || day > length) { addCell('', false); continue; }
    const today = sameMonth && day === now.getDate();
    const item = addCell(day, cell % 7 > 4, today ? 'today' : '');
    if (today) item.setAttribute('aria-current','date');
  }
  todayLabel.dateTime = [now.getFullYear(), now.getMonth()+1, now.getDate()].map((n,i)=>i?String(n).padStart(2,'0'):n).join('-');
  todayLabel.textContent = dateFormat.format(now);
  lastDate = now.toDateString();
}
function addCell(value, weekend, extra) {
  const el = document.createElement('span');
  el.textContent = value;
  if (weekend) el.classList.add('weekend');
  if (extra) el.classList.add(extra);
  grid.append(el);
  return el;
}
function nextWish() {
  wishIndex = (wishIndex + 1) % wishes.length;
  wish.textContent = wishes[wishIndex];
}
document.querySelectorAll('[data-step]').forEach(button => button.addEventListener('click', () => {
  const base = selectedMonth || new Date();
  const active = new Date(base.getFullYear(),base.getMonth()+Number(button.dataset.step),1);
  const now = new Date();
  selectedMonth = active.getFullYear() === now.getFullYear() && active.getMonth() === now.getMonth() ? null : active;
  paintCalendar();
}));
document.querySelector('.reshuffle').addEventListener('click', nextWish);
paintCalendar();
setInterval(() => { if (new Date().toDateString() !== lastDate) paintCalendar(); }, 15000);
setInterval(nextWish, 12000);
</script></body></html>
